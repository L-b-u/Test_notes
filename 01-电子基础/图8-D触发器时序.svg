<text x="24" y="436" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal">Scan 测试就是先把这个触发器串起来，再用时钟把它“搬”出来看。</text>
