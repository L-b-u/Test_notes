<text x="24" y="500" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="normal">Q 点的横坐标是 UBEQ、纵坐标是 IBQ；曲线越陡（IEQ 越大），rbe 越小。</text>
