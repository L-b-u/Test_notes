<text x="24" y="34" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="bold">图1　欧姆定律与回路（KVL）</text>
<line x1="150" y1="110" x2="150" y2="193.0" stroke="#1a1a1a" stroke-width="2"/>
<line x1="124" y1="193.0" x2="176" y2="193.0" stroke="#1a1a1a" stroke-width="3"/>
<line x1="138" y1="217.0" x2="162" y2="217.0" stroke="#1a1a1a" stroke-width="5"/>
<line x1="150" y1="217.0" x2="150" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<text x="190" y="185.0" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="16" fill="#c62828" text-anchor="start" font-weight="bold">+</text>
<text x="190" y="229.0" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="16" fill="#c62828" text-anchor="start" font-weight="bold">−</text>
<line x1="150" y1="110" x2="340" y2="110" stroke="#1a1a1a" stroke-width="2"/>
<line x1="420" y1="110" x2="620" y2="110" stroke="#1a1a1a" stroke-width="2"/>
<rect x="340" y="88" width="80" height="44" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="380" y="76" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">R</text>
<line x1="620" y1="110" x2="620" y2="300" stroke="#1a1a1a" stroke-width="2"/>
<line x1="620" y1="300" x2="150" y2="300" stroke="#1a1a1a" stroke-width="2"/>
