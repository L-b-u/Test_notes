<text x="24" y="404" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="14" fill="#8a8a8a" text-anchor="start" font-weight="normal">分压公式在偏置电路里天天用：Rb 上分到的电压 = VCC − 0.7 V。</text>
